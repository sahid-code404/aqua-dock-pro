name: Regenerate v266 POT once

on:
  push:
    branches:
      - fix/file-copy-only-v266

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-copy-only-v266
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Regenerate translation template
        run: po/update-pot.sh
      - name: Commit regenerated POT
        run: |
          if git diff --quiet -- po/aqua-dock-pro.pot; then
            echo "POT already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add po/aqua-dock-pro.pot
          git commit -m "Regenerate POT for v266 copy-only file menu"
          git push origin HEAD:fix/file-copy-only-v266
