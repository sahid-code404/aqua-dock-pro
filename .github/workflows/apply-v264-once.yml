name: Apply v264 Once

on:
  push:
    branches:
      - fix/menu-anchor-v264

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install tools
        run: dnf install -y git python3

      - uses: actions/checkout@v4

      - name: Apply v264 menu anchor fix
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'dock/dockItem.js',
              "        this._icon.add_child(this._peakIcon);\n        this._peakTierThresholds = peakTierThresholds(cfg.zoomMax);\n",
              "        this._icon.add_child(this._peakIcon);\n\n        // BoxPointer combines transformed source extents with an unscaled\n        // source content box. Anchoring to the magnified icon therefore shifts\n        // popup arrows away from the visual icon centre. Keep a tiny unscaled\n        // point actor on the visible icon edge for all context menus.\n        this._menuAnchor = new St.Widget({ reactive: false, opacity: 0 });\n        this._menuAnchor.set_size(2, 2);\n        this.add_child(this._menuAnchor);\n\n        this._peakTierThresholds = peakTierThresholds(cfg.zoomMax);\n",
          )

          replace_once(
              'dock/dockItem.js',
              "    get gicon() { return this._gicon; }\n\n    setGicon(gicon) {\n",
              "    get gicon() { return this._gicon; }\n\n    get menuAnchor() {\n        this._positionMenuAnchor();\n        return this._menuAnchor ?? this;\n    }\n\n    _positionMenuAnchor() {\n        if (!this._menuAnchor || !this._icon || !this._cfg || this._iconBaseX == null)\n            return;\n\n        const size = this._baseIconSize ?? this._cfg.iconSize;\n        const sx = this._icon.scale_x ?? this.scaleCurrent ?? 1;\n        const sy = this._icon.scale_y ?? this.scaleCurrent ?? 1;\n        const tx = this._icon.translation_x ?? 0;\n        const ty = this._icon.translation_y ?? 0;\n        const px = this._pivotX ?? 0.5;\n        const py = this._pivotY ?? 1.0;\n        const drawnX = this._iconBaseX + tx + size * px * (1 - sx);\n        const drawnY = this._iconBaseY + ty + size * py * (1 - sy);\n        const drawnW = size * sx;\n        const drawnH = size * sy;\n\n        let x;\n        let y;\n        if (!this._vert) {\n            x = drawnX + drawnW / 2;\n            y = drawnY;\n        } else if (!this._isRight) {\n            x = drawnX + drawnW;\n            y = drawnY + drawnH / 2;\n        } else {\n            x = drawnX;\n            y = drawnY + drawnH / 2;\n        }\n\n        this._menuAnchor.set_position(Math.round(x) - 1, Math.round(y) - 1);\n    }\n\n    setGicon(gicon) {\n",
          )

          replace_once(
              'menus/menuManager.js',
              "        const anchor = item._icon ?? item;\n",
              "        const anchor = item.menuAnchor ?? item._icon ?? item;\n",
          )

          metadata_path = Path('metadata.json')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          metadata['version'] = 264
          metadata_path.write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## 264\n' not in changelog:
              marker = '# Changelog\n\n'
              section = (
                  '## 264\n\n'
                  '- Fix both AquaDockPro and GNOME native application context menus opening off-centre while an icon is magnified by anchoring popups to an unscaled point on the visible icon edge.\n'
                  '- Keep bottom-dock menus centred directly above the icon and left/right dock menus centred on the outward icon edge without changing menu actions, styling, magnification, or hover behaviour.\n'
                  '- Preserve the v263 native GNOME menu fallback and v262 Genie/Reduce Motion compatibility unchanged.\n\n'
              )
              if not changelog.startswith(marker):
                  raise SystemExit('unexpected CHANGELOG header')
              changelog_path.write_text(marker + section + changelog[len(marker):], encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dock/dockItem.js menus/menuManager.js metadata.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "v264 changes already applied."
            exit 0
          fi
          git commit -m "Release v264 center context menus on icons"
          git push
