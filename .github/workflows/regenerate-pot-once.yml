name: Regenerate POT Once

on:
  push:
    branches:
      - fix/ego-clipboard-v259

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install tools
        run: dnf install -y git gettext

      - uses: actions/checkout@v4

      - name: Regenerate and commit translation template
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          po/update-pot.sh
          if git diff --quiet -- po/aqua-dock-pro.pot; then
            echo "POT is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add po/aqua-dock-pro.pot
          git commit -m "Regenerate translation template for v259"
          git push
