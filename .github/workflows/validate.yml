name: Validate

on:
  push:
  pull_request:

jobs:
  extension:
    name: Extension (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: GNOME 50
            image: fedora:44
            major: "50"
          - shell: GNOME 51
            image: fedora:45
            major: "51"
    container: ${{ matrix.image }}

    steps:
      - name: Install Git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: dnf install -y gjs glib2 gettext jq gnome-shell libadwaita python3 unzip xorg-x11-server-Xvfb

      - name: Verify GNOME Shell version
        run: |
          shell_version="$(gnome-shell --version)"
          printf '%s\n' "$shell_version"
          shell_major="$(printf '%s\n' "$shell_version" | sed -E 's/.* ([0-9]+).*/\1/')"
          test "$shell_major" = "${{ matrix.major }}"

      - name: EGO compatibility audit
        run: python3 scripts/ego-audit.py

      - name: Static and unit checks
        run: scripts/validate.sh

      - name: Preferences smoke test
        run: xvfb-run -a env AQUA_RUN_PREFS_SMOKE=1 scripts/validate.sh

      - name: Package and audit EGO bundle
        run: |
          scripts/package.sh dist
          scripts/audit-package.sh dist/aqua-dock-pro@shaque.shell-extension.zip
